  <style>

    .filters input { width: 220px; }
    .filters select { cursor: pointer; }
    .filters input:focus, .filters select:focus { outline: none; border-color: #c89b3c; }
    .reset-btn { background: #c89b3c; color: #0d0f1a; border: none; padding: 7px 16px; border-radius: 6px; font-size: .85em; font-weight: bold; cursor: pointer; font-family: Georgia,serif; margin-left: auto; }
    .reset-btn:hover { background: #e0b44e; }
    .result-count { font-size: .8em; color: #7a7060; white-space: nowrap; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 20px; justify-content: flex-start; }

    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(200,155,60,.25); border-color: #c89b3c88; }

<body>
<div class="header">
  <h1>Dota 2 Cube</h1>
  <div class="tagline">Universes Beyond &nbsp;&middot;&nbsp; Custom Design Portfolio</div>
</div>
<div class="dashboard">
  <div class="stat-box"><div class="stat-number" id="displayed-count">0</div><div class="stat-label" id="kpiLabel">Draft Cards</div></div>
  <div class="chart-box"><div class="chart-title">Color Identity Distribution</div><canvas id="colorChart"></canvas></div>
  <div class="chart-box"><div class="chart-title">Mana Curve</div><canvas id="cmcChart"></canvas></div>
  <div class="chart-box"><div class="chart-title">Card Types</div><canvas id="typeChart"></canvas></div>
</div>
<div class="filters">
  <input type="text" id="search" placeholder="Search name or text&hellip;" oninput="applyFilters()">
  <select id="color-filter" onchange="applyFilters()">
    <option value="">All Colors</option>
    <option value="White">White</option><option value="Blue">Blue</option>
    <option value="Black">Black</option><option value="Red">Red</option>
    <option value="Green">Green</option>
    <option value="Azorius">Azorius (WU)</option><option value="Orzhov">Orzhov (WB)</option>
    <option value="Boros">Boros (WR)</option><option value="Selesnya">Selesnya (WG)</option>
    <option value="Dimir">Dimir (UB)</option><option value="Izzet">Izzet (UR)</option>
    <option value="Simic">Simic (UG)</option><option value="Rakdos">Rakdos (BR)</option>
    <option value="Golgari">Golgari (BG)</option><option value="Gruul">Gruul (RG)</option>
    <option value="Colorless">Colorless</option>
  </select>
  <select id="type-filter" onchange="applyFilters()">
    <option value="">All Types</option>
    <option value="Creature">Creature</option><option value="Instant">Instant</option>
    <option value="Sorcery">Sorcery</option><option value="Enchantment">Enchantment</option>
    <option value="Artifact">Artifact</option><option value="Land">Land</option>
  </select>
  <select id="rarity-filter" onchange="applyFilters()">
    <option value="">All Rarities</option>
    <option value="common">Common</option><option value="uncommon">Uncommon</option>
    <option value="rare">Rare</option><option value="mythic rare">Mythic</option>
  </select>
  <select id="cmc-filter" onchange="applyFilters()">
    <option value="">All CMC</option>
    <option value="0">0</option><option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
    <option value="6">6+</option>
  </select>
  <select id="variant-filter" onchange="applyFilters()">
    <option value="All">All Cube Cards</option>
    <option value="Token">Tokens Only</option>
  </select>
  <select id="sort-filter" onchange="applyFilters()">
    <option value="name">Name (A&ndash;Z)</option>
    <option value="cmc">Mana Value</option><option value="color">Color</option>
    <option value="rarity">Rarity</option><option value="type">Type</option>
  </select>
  <span class="result-count" id="result-count"></span>
  <button class="reset-btn" onclick="resetFilters()">Reset Filters</button>
</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="modalBgClick(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

let chart1, chart2, chart3;
let visibleCards = [];

const SCRYFALL = "https://svgs.scryfall.io/card-symbols/";

function manaImg(sym) {
  return `<img src="${SCRYFALL}${sym}.svg" style="width:22px;height:22px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.6);vertical-align:middle;display:inline-block;" title="{${sym}}">`;
}

function formatCost(syms) {
  if (!syms || !syms.length) return "";
  return syms.map(manaImg).join("");
}

function rarityClass(r) {
  if (!r) return "r-common";
  const rl = r.toLowerCase();
  if (rl.includes("mythic")) return "r-mythic";
  if (rl === "rare") return "r-rare";
  if (rl === "uncommon") return "r-uncommon";
  return "r-common";
}

function rarityOrder(r) {
  if (!r) return 0;
  const rl = r.toLowerCase();
  if (rl.includes("mythic")) return 3;
  if (rl === "rare") return 2;
  if (rl === "uncommon") return 1;
  return 0;
}

function applyFilters() {
  const q   = document.getElementById("search").value.toLowerCase();
  const col = document.getElementById("color-filter").value;
  const typ = document.getElementById("type-filter").value;
  const rar = document.getElementById("rarity-filter").value;
  const cmc = document.getElementById("cmc-filter").value;
  const vrnt = document.getElementById("variant-filter").value;
  const srt = document.getElementById("sort-filter").value;

  let filtered = ALL_CARDS.filter(c => {
    const nm = !q || (c.name||"").toLowerCase().includes(q) || (c.rules||"").toLowerCase().includes(q);
    const cm = !col || c.color_label === col;
    const tm = !typ || (c.type||"").includes(typ);
    const rm = !rar || (c.rarity||"").toLowerCase() === rar;
    const mm = !cmc || (cmc==="6" ? c.cmc>=6 : c.cmc==parseInt(cmc));
    const vm = vrnt==="Token" ? c.is_token : !c.is_token;
    return nm && cm && tm && rm && mm && vm;
  });

  filtered.sort((a,b) => {
    if (srt==="name")   return (a.name||"").localeCompare(b.name||"");
    if (srt==="cmc")    return (a.cmc||0)-(b.cmc||0) || (a.name||"").localeCompare(b.name||"");
    if (srt==="color")  return (a.color_label||"").localeCompare(b.color_label||"") || (a.name||"").localeCompare(b.name||"");
    if (srt==="rarity") return rarityOrder(b.rarity)-rarityOrder(a.rarity) || (a.name||"").localeCompare(b.name||"");
    if (srt==="type")   return (a.type||"").localeCompare(b.type||"") || (a.name||"").localeCompare(b.name||"");
    return 0;
  });

  visibleCards = filtered;
  renderGrid(filtered);
  document.getElementById("result-count").textContent = filtered.length + " of " + ALL_CARDS.length + " cards";
  document.getElementById("displayed-count").textContent = filtered.length;
  document.getElementById("kpiLabel").textContent = vrnt==="Token" ? "Tokens" : "Draft Cards";
  updateCharts(filtered);
}

function resetFilters() {
  ["search"].forEach(id => document.getElementById(id).value = "");
  ["color-filter","type-filter","rarity-filter","cmc-filter","sort-filter"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("variant-filter").value = "All";
  document.getElementById("sort-filter").value = "name";
  applyFilters();
}

function cardImgSrc(c) {
  // Cache-bust with the art's content hash so a browser that already
  // cached this filename under old/wrong bytes is forced to refetch.
  return "renders/" + encodeURIComponent(c.render) + (c.img_ver ? ("?v=" + c.img_ver) : "");
}

function renderGrid(cards) {
  document.getElementById("grid").innerHTML = cards.map((c,i) => {
    const img = c.render
      ? "<img src=\"" + cardImgSrc(c) + "\" alt=\"" + c.name + "\" loading=\"lazy\" onerror=\"this.style.display='none'\">"
      : "<div class=\"no-img\">&#127820;</div>";
    return "<div class=\"card\" onclick=\"showModal(" + i + ")\">" + img + "<div class=\"card-footer\"><span class=\"card-name\">" + c.name + "</span><span class=\"rarity-dot " + rarityClass(c.rarity) + "\"></span></div></div>";
  }).join("");
}

function renderRulesSymbols(text) {
  if (!text) return "";
  // Replace hybrid mana in rules text: R/W, W/B, G/W etc
  // Scryfall hybrid files use a fixed color-wheel order, not alphabetical --
  // the reverse spelling (e.g. "WG") does not exist as a file.
  const HYBRID_PAIRS = {WU:"WU",UW:"WU",UB:"UB",BU:"UB",BR:"BR",RB:"BR",
    RG:"RG",GR:"RG",GW:"GW",WG:"GW",WB:"WB",BW:"WB",UR:"UR",RU:"UR",
    BG:"BG",GB:"BG",RW:"RW",WR:"RW",GU:"GU",UG:"GU"};
  text = text.replace(/([WUBRGC2])\/([WUBRGCP])/gi, (m, a, b) => {
    a = a.toUpperCase(); b = b.toUpperCase();
    let sym;
    if (a === "2" || a === "P") { sym = a + b; }
    else if (b === "P") { sym = a + b; }
    else { sym = HYBRID_PAIRS[a+b] || (a+b); }
    return `<img src="${SCRYFALL}${sym}.svg" style="width:15px;height:15px;border-radius:50%;vertical-align:-2px;display:inline-block;">`;
  });
  // Replace single mana symbols: W, U, B, R, G, C, X, T
  text = text.replace(/\b([WUBRGCXT])\b(?![\/<])/g, (m, sym) => {
    return `<img src="${SCRYFALL}${sym}.svg" style="width:15px;height:15px;border-radius:50%;vertical-align:-2px;display:inline-block;">`;
  });
  return text;
}

function showModal(localIdx) {
  const c = visibleCards[localIdx];
  if (!c) return;
  const rules = renderRulesSymbols((c.rules||"").replace(/\n/g,"<br>"));
  document.getElementById("modal-body").innerHTML =
    (c.render ? `<img src="${cardImgSrc(c)}">` : "") +
    `<div class="modal-name">${c.name}</div>` +
    `<div class="modal-cost">${formatCost(c.mana_symbols)}</div>` +
    `<div class="modal-type">${c.type||""}</div>` +
    `<div class="modal-rules">${rules}</div>` +
    (c.flavor ? `<div class="modal-flavor">${c.flavor}</div>` : "") +
    (c.pt ? `<div class="modal-pt">${c.pt}</div>` : "") +
    `<div class="modal-meta">` +
      (c.rarity ? `<span class="badge">${c.rarity}</span>` : "") +
      (c.color_label ? `<span class="badge">${c.color_label}</span>` : "") +
      (c.cmc!==undefined ? `<span class="badge">CMC ${c.cmc}</span>` : "") +
    `</div>`;
  document.getElementById("modal").classList.add("active");
}

function closeModal() { document.getElementById("modal").classList.remove("active"); }
function modalBgClick(e) { if (e.target===document.getElementById("modal")) closeModal(); }

const CD = {
  plugins: { legend: { labels: { color:"#7a7060", font:{size:10} } } },
  scales: {
    x: { ticks:{color:"#7a7060",font:{size:9}}, grid:{color:"#ffffff0a"} },
    y: { ticks:{color:"#7a7060",font:{size:9}}, grid:{color:"#ffffff0a"} }
  }
};

function updateCharts(active) {
  const colorMap={}, cmcC={}, typeC={Creature:0,Instant:0,Sorcery:0,Enchantment:0,Artifact:0,Land:0,Other:0};
  active.forEach(c => {
    colorMap[c.color_label] = (colorMap[c.color_label]||0)+1;
    cmcC[c.cmc] = (cmcC[c.cmc]||0)+1;
    let found=false;
    ["Creature","Sorcery","Instant","Artifact","Enchantment","Land"].forEach(t => { if((c.type||"").includes(t)){typeC[t]++;found=true;} });
    if(!found) typeC.Other++;
  });
  const lkeys=["White","Blue","Black","Red","Green","Azorius","Orzhov","Boros","Selesnya","Dimir","Izzet","Simic","Rakdos","Golgari","Gruul","Colorless","Land"];
  const cl=lkeys.filter(k=>colorMap[k]>0);
  chart1.data.labels=cl; chart1.data.datasets[0].data=cl.map(k=>colorMap[k]||0); chart1.update();
  const mx=Math.max(...Object.keys(cmcC).map(Number),5);
  const cl2=Array.from({length:mx+1},(_,i)=>i);
  chart2.data.labels=cl2.map(k=>k>=9?"9+":k); chart2.data.datasets[0].data=cl2.map(l=>cmcC[l]||0); chart2.update();
  chart3.data.datasets[0].data=Object.values(typeC); chart3.update();
}

function initCharts() {
  const lkeys=["White","Blue","Black","Red","Green","Azorius","Orzhov","Boros","Selesnya","Dimir","Izzet","Simic","Rakdos","Golgari","Gruul","Colorless","Land"];
  const colorMap={}, cmcC={}, typeC={Creature:0,Sorcery:0,Instant:0,Artifact:0,Enchantment:0,Land:0,Other:0};
  ALL_CARDS.filter(c=>!c.is_token).forEach(c=>{
    colorMap[c.color_label]=(colorMap[c.color_label]||0)+1;
    cmcC[c.cmc]=(cmcC[c.cmc]||0)+1;
    let found=false;
    ["Creature","Sorcery","Instant","Artifact","Enchantment","Land"].forEach(t=>{if((c.type||"").includes(t)){typeC[t]++;found=true;}});
    if(!found) typeC.Other++;
  });

  const cl=lkeys.filter(k=>colorMap[k]>0);
  chart1=new Chart(document.getElementById("colorChart"),{
    type:"bar",
    data:{labels:cl,datasets:[{data:cl.map(k=>colorMap[k]||0),backgroundColor:"#c89b3c88",borderColor:"#c89b3c",borderWidth:1}]},
    options:{...CD,plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false,
      onClick:(e,els)=>{ if(els.length){document.getElementById("color-filter").value=chart1.data.labels[els[0].index];applyFilters();} }}
  });

  const mx=Math.max(...Object.keys(cmcC).map(Number),5);
  const cl2=Array.from({length:mx+1},(_,i)=>i);
  chart2=new Chart(document.getElementById("cmcChart"),{
    type:"bar",
    data:{labels:cl2.map(k=>k>=9?"9+":k),datasets:[{data:cl2.map(l=>cmcC[l]||0),backgroundColor:"#c89b3c88",borderColor:"#c89b3c",borderWidth:1}]},
    options:{...CD,plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false,
      onClick:(e,els)=>{ if(els.length){let v=chart2.data.labels[els[0].index].toString().replace("+","");document.getElementById("cmc-filter").value=v;applyFilters();} }}
  });

  chart3=new Chart(document.getElementById("typeChart"),{
    type:"doughnut",
    data:{labels:Object.keys(typeC),datasets:[{data:Object.values(typeC),backgroundColor:["#4a9e6b","#6aadff","#aa88ff","#ffaa44","#ff6688","#c89b3c","#7a7060"],borderColor:"#1a1e30",borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"right",labels:{color:"#7a7060",font:{size:9},boxWidth:12}}},
      onClick:(e,els)=>{ if(els.length){const lb=chart3.data.labels[els[0].index];if(document.querySelector(`#type-filter option[value="${lb}"]`)){document.getElementById("type-filter").value=lb;applyFilters();}} }}
  });

  applyFilters();
}

window.onload = initCharts;
</script>
